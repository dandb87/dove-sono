<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dove sono</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
  :root {
    --space: #04070f;
    --panel: rgba(10, 18, 32, 0.88);
    --text: #e9eff8;
    --muted: #93a3bb;
    --accent: #9fd8ff;
    --accent-ink: #06121f;
    --pin: #ffb454;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--space); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(440px, calc(100% - 32px));
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid rgba(159, 216, 255, 0.18); border-radius: 14px;
    padding: 18px 18px 16px; z-index: 5;
  }
  .panel h1 { font-size: 1.15rem; margin: 0 0 6px; font-weight: 650; letter-spacing: 0.01em; }
  .panel p { margin: 0 0 14px; color: var(--muted); font-size: 0.95rem; line-height: 1.45; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px;
    padding: 11px 16px; background: var(--accent); color: var(--accent-ink);
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid rgba(233, 239, 248, 0.3); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: default; }
  .linkbox {
    width: 100%; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(233, 239, 248, 0.2); background: rgba(0, 0, 0, 0.3);
    color: var(--text); font: 0.85rem ui-monospace, Menlo, Consolas, monospace;
  }
  .status { min-height: 1.2em; margin-top: 10px; font-size: 0.88rem; color: var(--muted); }
  .status.err { color: #ff9b9b; }
  .hidden { display: none !important; }

  .viewer-tag {
    position: absolute; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 5; background: var(--panel); border: 1px solid rgba(159, 216, 255, 0.18);
    border-radius: 999px; padding: 8px 16px; font-size: 0.9rem; white-space: nowrap;
    transition: opacity 0.6s;
  }
  .pin {
    width: 18px; height: 18px; border-radius: 50%; background: var(--pin);
    border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(255, 180, 84, 0.7);
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse { to { box-shadow: 0 0 0 26px rgba(255, 180, 84, 0); } }
  @media (prefers-reduced-motion: reduce) { .pin { animation: none; } }
</style>
</head>
<body>
<div id="map" aria-label="Mappa"></div>

<div id="viewerTag" class="viewer-tag hidden">Sto volando verso la posizione condivisa</div>

<section id="senderPanel" class="panel hidden">
  <h1>Condividi dove sei</h1>
  <p>Premi il pulsante: la pagina legge la tua posizione e crea un link. Chi lo apre vede la Terra dallo spazio e poi lo zoom fino al tuo punto.</p>
  <input id="linkBox" class="linkbox hidden" readonly aria-label="Link da condividere">
  <div class="row">
    <button id="locateBtn">Usa la mia posizione</button>
    <button id="shareBtn" class="hidden">Invia il link</button>
    <button id="copyBtn" class="secondary hidden">Copia</button>
    <button id="previewBtn" class="secondary hidden">Anteprima</button>
  </div>
  <div id="status" class="status" role="status"></div>
</section>

<section id="viewerPanel" class="panel hidden">
  <div class="row">
    <button id="replayBtn">Rivedi il volo</button>
    <button id="openMapsBtn" class="secondary">Apri in Google Maps</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
(function () {
  // Stile: globo con immagini satellitari Esri World Imagery.
  var style = {
    version: 8,
    projection: { type: "globe" },
    sources: {
      sat: {
        type: "raster",
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        tileSize: 256,
        maxzoom: 19,
        attribution: "Immagini: Esri, Maxar, Earthstar Geographics"
      }
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#04070f" } },
      { id: "sat", type: "raster", source: "sat" }
    ]
  };

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var map = new maplibregl.Map({
    container: "map",
    style: style,
    center: [10, 25],
    zoom: 0.6,
    pitch: 0,
    attributionControl: { compact: true }
  });

  var marker = null;
  var target = null;   // {lat, lng}
  var spinning = true;

  // Rotazione lenta del globo finché non parte il volo.
  function spin() {
    if (!spinning || reduceMotion) return;
    var c = map.getCenter();
    map.easeTo({ center: [c.lng + 25, c.lat], duration: 2000, easing: function (t) { return t; } });
  }
  map.on("moveend", function () { if (spinning) spin(); });

  function parseHash() {
    var m = location.hash.replace("#", "").split(",");
    if (m.length < 2) return null;
    var lat = parseFloat(m[0]), lng = parseFloat(m[1]);
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat: lat, lng: lng };
  }

  function fly(t) {
    spinning = false;
    map.stop();
    if (marker) { marker.remove(); marker = null; }
    // Ripartenza dalla vista spaziale.
    map.jumpTo({ center: [t.lng - 40, t.lat * 0.6], zoom: 0.6, pitch: 0, bearing: 0 });
    setTimeout(function () {
      map.flyTo({
        center: [t.lng, t.lat],
        zoom: 17,
        pitch: reduceMotion ? 0 : 50,
        bearing: reduceMotion ? 0 : -20,
        duration: reduceMotion ? 1500 : 9000,
        curve: 1.7,
        essential: true
      });
    }, 900);
    map.once("moveend", function () {
      var el = document.createElement("div");
      el.className = "pin";
      marker = new maplibregl.Marker({ element: el }).setLngLat([t.lng, t.lat]).addTo(map);
      document.getElementById("viewerTag").textContent = "Eccomi";
    });
  }

  function $(id) { return document.getElementById(id); }
  function setStatus(msg, isErr) {
    var s = $("status");
    s.textContent = msg;
    s.className = "status" + (isErr ? " err" : "");
  }

  function buildLink(lat, lng) {
    var base = location.href.split("#")[0];
    return base + "#" + lat.toFixed(5) + "," + lng.toFixed(5);
  }

  function showViewer(t) {
    target = t;
    $("senderPanel").classList.add("hidden");
    $("viewerPanel").classList.remove("hidden");
    $("viewerTag").classList.remove("hidden");
    $("viewerTag").textContent = "Sto volando verso la posizione condivisa";
    map.once("load", function () { fly(t); });
    if (map.loaded()) fly(t);
  }

  function showSender() {
    $("senderPanel").classList.remove("hidden");
    $("viewerPanel").classList.add("hidden");
    $("viewerTag").classList.add("hidden");
    spinning = true;
    map.once("load", spin);
  }

  // Modalità destinatario o mittente a seconda del link.
  var initial = parseHash();
  if (initial) showViewer(initial); else showSender();

  window.addEventListener("hashchange", function () {
    var t = parseHash();
    if (t) showViewer(t); else showSender();
  });

  // Mittente
  var currentLink = "";
  $("locateBtn").addEventListener("click", function () {
    if (!navigator.geolocation) { setStatus("Questo browser non supporta la geolocalizzazione.", true); return; }
    $("locateBtn").disabled = true;
    setStatus("Sto cercando la tua posizione…");
    navigator.geolocation.getCurrentPosition(function (pos) {
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      currentLink = buildLink(lat, lng);
      target = { lat: lat, lng: lng };
      $("linkBox").value = currentLink;
      $("linkBox").classList.remove("hidden");
      $("copyBtn").classList.remove("hidden");
      $("previewBtn").classList.remove("hidden");
      if (navigator.share) $("shareBtn").classList.remove("hidden");
      $("locateBtn").textContent = "Aggiorna posizione";
      $("locateBtn").disabled = false;
      setStatus("Link pronto. Contiene le tue coordinate esatte di adesso.");
    }, function (err) {
      $("locateBtn").disabled = false;
      var msg = err.code === 1 ? "Permesso negato. Consenti la posizione per questo sito nelle impostazioni del browser."
              : err.code === 2 ? "Posizione non disponibile. Riprova all'aperto o con il GPS attivo."
              : "Tempo scaduto. Riprova.";
      setStatus(msg, true);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });

  $("copyBtn").addEventListener("click", function () {
    var done = function () { setStatus("Link copiato."); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentLink).then(done, function () { $("linkBox").select(); setStatus("Copia manuale: il link è selezionato."); });
    } else { $("linkBox").select(); setStatus("Copia manuale: il link è selezionato."); }
  });

  $("shareBtn").addEventListener("click", function () {
    navigator.share({ title: "Dove sono", text: "Guarda dove mi trovo", url: currentLink }).catch(function () {});
  });

  $("previewBtn").addEventListener("click", function () {
    $("senderPanel").classList.add("hidden");
    $("viewerPanel").classList.remove("hidden");
    $("viewerTag").classList.remove("hidden");
    fly(target);
  });

  // Destinatario
  $("replayBtn").addEventListener("click", function () {
    $("viewerTag").textContent = "Sto volando verso la posizione condivisa";
    fly(target);
  });
  $("openMapsBtn").addEventListener("click", function () {
    if (!target) return;
    window.open("https://www.google.com/maps?q=" + target.lat + "," + target.lng, "_blank", "noopener");
  });
})();
</script>
</body>
</html>
